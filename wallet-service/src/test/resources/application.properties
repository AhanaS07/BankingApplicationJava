# Test-only overrides. Keeps the @SpringBootTest context self-contained so the build does not
# depend on config-server, Eureka, Zipkin or a running MongoDB being up on the machine.
# A .properties file on the test classpath takes precedence over src/main/resources/application.yml.
spring.application.name=wallet-service
spring.profiles.active=test

# No external config-server lookup during tests.
spring.cloud.config.enabled=false
spring.config.import=

# No service registration/discovery during tests.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Mongo connects lazily, so this URI is never dialled by the context-load test.
spring.data.mongodb.uri=mongodb://localhost:27017/walletdb-test

# No span export during tests.
management.tracing.enabled=false

logging.level.com.tnf.wallet_service=WARN
