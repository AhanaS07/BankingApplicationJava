# server.port, spring.data.mongodb.uri and eureka config are centralised in the config-server
# (config-files/wallet-service.properties + config-files/application.properties).
spring:
  application:
    name: wallet-service

logging:
  level:
    com.tnf.wallet_service: DEBUG

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # Will trace all requests
    propagation: # In which format data is being sent 
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans