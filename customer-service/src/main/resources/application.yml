# server.port, spring.data.mongodb.uri and eureka config are centralised in the config-server
# (config-files/customer-service.properties + config-files/application.properties).
spring:
  application:
    name: customer-service

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG
    com.tnf.customer_service: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans,httptrace,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: Customer Service
    version: 1.0.0
    description: Manages Customers and Addresses

springdoc:
  api-docs:
    path: /api/customers/v3/api-docs
  swagger-ui:
    path: /api/customers/swagger-ui.html
