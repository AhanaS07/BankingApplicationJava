server:
  port: 8082

spring:
  application:
    name: customer-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/customerdb

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Shared secret that gates the internal-only customer provisioning endpoint (POST /api/customers).
# Must match auth-service's value; supplied via INTERNAL_API_KEY in every real environment.
security:
  internal:
    api-key: ${INTERNAL_API_KEY:change-me-in-prod-internal-provisioning-key}

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG
    com.tnf.customer_service: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans,httptrace,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: Customer Service
    version: 1.0.0
    description: Manages Customers and Addresses

springdoc:
  api-docs:
    path: /api/customers/v3/api-docs
  swagger-ui:
    path: /api/customers/swagger-ui.html
