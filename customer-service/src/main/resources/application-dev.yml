# server.port, spring.data.mongodb.uri and eureka config are centralised in the config-server
# (config-files/customer-service.properties + config-files/application.properties).
spring:
  application:
    name: customer-service

logging:
  level:
    com.tnf.customer_service: DEBUG

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
