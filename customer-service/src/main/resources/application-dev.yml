server:
  port: 8082

spring:
  application:
    name: customer-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/customerdb

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Shared internal provisioning secret (must match auth-service). Dev default only.
security:
  internal:
    api-key: ${INTERNAL_API_KEY:change-me-in-prod-internal-provisioning-key}

logging:
  level:
    com.tnf.customer_service: DEBUG

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
