spring.application.name=config-server
server.port=8888

spring.cloud.config.server.git.uri=https://github.com/moktiksalgotra/config-files
spring.cloud.config.server.git.default-label=main

# Clone the config repo when the server starts (fail fast if it's unreachable).
spring.cloud.config.server.git.clone-on-start=true

# ---- Eureka (service discovery) ----
# Register the config server with Eureka so services can discover it.
# Requires a running Eureka server on port 8761.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- Actuator (observability: Prometheus/Grafana) ----
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# If the config repo is PRIVATE, uncomment and use a GitHub Personal Access Token:
#spring.cloud.config.server.git.username=<github-username>
#spring.cloud.config.server.git.password=<github-personal-access-token>
