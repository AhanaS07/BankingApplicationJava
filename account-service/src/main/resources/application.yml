# server.port, spring.data.mongodb.uri and eureka config are centralised in the config-server
# (config-files/account-service.properties + config-files/application.properties).
spring:
  application:
    name: account-service

logging:
  level:
    com.tnf.account: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans,httptrace,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # Trace all requests
    propagation:
      type: b3 # Zipkin-compatible trace propagation format
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: Account Service
    version: 1.0.0
    description: Manages Bank Accounts and Transactions

springdoc:
  api-docs:
    path: /api/accounts/v3/api-docs
  swagger-ui:
    path: /api/accounts/swagger-ui.html
