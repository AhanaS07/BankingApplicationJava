server:
  port: 8083

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/accountdb
  cloud:
    config:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
