# server.port, spring.data.mongodb.uri and eureka config are centralised in the config-server
# (config-files/account-service.properties + config-files/application.properties).
spring:
  application:
    name: account-service

logging:
  level:
    com.tnf.account: DEBUG

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # Trace all requests
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
