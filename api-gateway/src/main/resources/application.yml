server:
    port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: dev,prod

#ADD SECURITY CONFIGURATION

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # Route all auth traffic to the auth-service (load-balanced via Eureka).
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/api/wallets/**
          filters:
            - name: CircuitBreaker
              args:
                name: walletServiceCB
                fallbackUri: forward:/fallback/wallets

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountServiceCB
                fallbackUri: forward:/fallback/accounts

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.sleuth: DEBUG

management:
  endpoints:
    web:
      exposure:
        #NOTICE: Changed 'routes' to 'gateway'
        include: health,info,metrics,beans,httptrace,gateway,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    # REQUIRED for Gateway: This unlocks route viewing and manipulation
    gateway:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # Will trace all requests
    propagation: # In which format data is being sent 
      type: b3 # Standards thru which info is sent in the header (allows hyphens in code) - Zipkin type is b3 - how is it being sent
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

info:
  app:
    name: API-GATEWAY
    version: 1.0.0
    description: Manages API Gateway

# JWT verification at the edge. The secret and issuer MUST match auth-service so the gateway can
# validate tokens auth-service signed. Supply JWT_SECRET via the environment in real deployments.
security:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-256-bit-development-secret-key-0123456789}
    issuer: auth-service

springdoc:
  swagger-ui:
    #This enables the dropdown menu in Swagger UI
    urls:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Wallet Service
        url: /api/wallets/v3/api-docs
      - name: Account Service
        url: /api/accounts/v3/api-docs
